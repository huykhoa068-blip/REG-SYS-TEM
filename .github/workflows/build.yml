name: Build Anti-Lag Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Initialize Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/antilag/app
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/jniLibs/arm64-v8a

    - name: Create settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AntiLagProject"
        include ':app'
        EOF

    - name: Create root build.gradle
      run: |
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

    - name: Create app/build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.antilag.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.antilag.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

    - name: Create strings.xml
      run: |
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Anti Lag System</string>
        </resources>
        EOF

    - name: Create AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">

            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true">
                
                <activity
                    android:name=".MainActivity"
                    android:theme="@android:style/Theme.NoDisplay"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AntiLagService"
                    android:foregroundServiceType="specialUse"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

    - name: Create MainActivity.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/MainActivity.java
        package com.antilag.app;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Build;
        import android.os.Bundle;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                Intent serviceIntent = new Intent(this, AntiLagService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(serviceIntent);
                } else {
                    startService(serviceIntent);
                }
                
                // Ẩn giao diện ngay lập tức sau khi kích hoạt Service
                finish();
            }
        }
        EOF

    - name: Create AntiLagService.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/AntiLagService.java
        package com.antilag.app;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;

        public class AntiLagService extends Service {
            private static final String CHANNEL_ID = "AntiLagChannel";

            // Khai báo hàm JNI gốc từ libkk.so
            public native void kichHoatChongLag();

            @Override
            public void onCreate() {
                super.onCreate();
                taoNotificationChannel();
                
                Notification notification = null;
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    notification = new Notification.Builder(this, CHANNEL_ID)
                            .setContentTitle("Anti-Lag System")
                            .setContentText("Dịch vụ ẩn đang tối ưu hệ thống...")
                            .build();
                } else {
                    notification = new Notification();
                }
                
                // Chạy Foreground Service vĩnh viễn
                startForeground(1, notification);

                // Khởi tạo vòng lặp vô hạn nạp JNI trong luồng riêng biệt
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        while (true) {
                            try {
                                System.loadLibrary("kk");
                                kichHoatChongLag();
                                Thread.sleep(5000);
                            } catch (Exception e) {
                                e.printStackTrace();
                            }
                        }
                    }
                }).start();
            }

            private void taoNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "Anti Lag Service Channel",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }
        }
        EOF

    - name: Copy libkk.so to JNI Structural Directory
      run: |
        if [ -f "libkk.so" ]; then
          cp libkk.so app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "Sao chép thư viện libkk.so thành công."
        else
          echo "Lỗi: Không tìm thấy file libkk.so ở thư mục gốc!"
          exit 1
        fi

    - name: Build APK with Gradle
      run: gradle :app:assembleDebug

    - name: Upload Output APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntiLag-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
